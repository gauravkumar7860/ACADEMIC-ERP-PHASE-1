<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Set a new password — Academic ERP</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="center-page"><div class="auth-box">
  <h1>Set a new password</h1><div class="sub">Required before you continue. Use at least 8 characters.</div>
  <form id="cpForm">
    <div class="field"><label for="currentPassword">Current or temporary password</label><input id="currentPassword" type="password" required></div>
    <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="8" required></div>
    <button class="btn" type="submit" style="width:100%">Update password</button>
    <div class="error-text" id="cpError" style="display:none"></div>
  </form>
</div></div>
<script src="/js/api.js"></script>
<script>
cpForm.addEventListener('submit', async (e) => {
  e.preventDefault(); cpError.style.display = 'none';
  try {
    await api('/auth/change-password', { method: 'POST', body: { currentPassword: currentPassword.value, newPassword: newPassword.value } });
    const me = await api('/auth/me');
    location.href = ROLE_HOME[me.user.role] || '/login.html';
  } catch (err) { cpError.textContent = err.message; cpError.style.display = 'block'; }
});
</script></body></html>
